<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Loading...</title>
<style>body{background:#111;color:#eee;font:20px sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
</head><body><div id="s">Loading game... 0%</div>
<script>
(async()=>{
  const parts=['parts/part1.txt','parts/part2.txt','parts/part3.txt'];
  const el=document.getElementById('s');
  try{
    const out=[];
    for(let i=0;i<parts.length;i++){
      const r=await fetch(parts[i]);
      if(!r.ok) throw new Error(parts[i]+' '+r.status);
      out.push(await r.text());
      el.textContent='Loading game... '+Math.round((i+1)/parts.length*100)+'%';
    }
    document.open();document.write(out.join(''));document.close();
  }catch(e){el.textContent='Failed to load: '+e.message+' (open this through a web server, not as a local file)';}
})();
</script></body></html>
